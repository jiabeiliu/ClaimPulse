name: Java build and local-stack smoke test

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit and Spark transformation tests
        run: mvn -B verify
      - name: Build and start local stack
        run: docker compose up --build -d
      - name: Wait for API and exercise pipeline
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then break; fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
          curl -fsS -X POST 'http://127.0.0.1:8080/api/demo/generate?count=5'
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/api/metrics | python3 -c 'import json,sys; assert json.load(sys.stdin)["totals"]["total_events"] >= 5' 2>/dev/null; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down
