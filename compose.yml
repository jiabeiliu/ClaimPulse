services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:19092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:19092", "--create", "--if-not-exists", "--topic", "claim-events", "--partitions", "3", "--replication-factor", "1"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claimpulse
      POSTGRES_USER: claimpulse
      POSTGRES_PASSWORD: claimpulse-local-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimpulse -d claimpulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      JDBC_URL: jdbc:postgresql://postgres:5432/claimpulse
      JDBC_USER: claimpulse
      JDBC_PASSWORD: claimpulse-local-only
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CLAIMPULSE_DEMO_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  stream:
    build:
      context: .
      dockerfile: stream/Dockerfile
    environment:
      JDBC_URL: jdbc:postgresql://postgres:5432/claimpulse
      JDBC_USER: claimpulse
      JDBC_PASSWORD: claimpulse-local-only
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CHECKPOINT_DIR: /checkpoint
    volumes:
      - spark_checkpoints:/checkpoint
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  spark_checkpoints:
