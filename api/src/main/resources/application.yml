server:
  port: 8080
spring:
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/claimpulse}
    username: ${JDBC_USER:claimpulse}
    password: ${JDBC_PASSWORD:claimpulse}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
management:
  endpoints:
    web:
      exposure:
        include: health,info
claimpulse:
  topic: ${KAFKA_TOPIC:claim-events}
  ingest-token: ${CLAIMPULSE_INGEST_TOKEN:}
  demo-enabled: ${CLAIMPULSE_DEMO_ENABLED:false}
